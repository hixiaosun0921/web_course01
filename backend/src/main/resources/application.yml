server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: course-select-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/course_select}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      # 首次启动自动建表并导入种子数据（脚本幂等，可重复执行）
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8

mybatis:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt:
    # 生产环境请通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:course-select-demo-secret-key-change-me-in-production}
    expire-hours: ${JWT_EXPIRE_HOURS:2}
  credit-max: ${CREDIT_MAX:36}
  wish-max: ${WISH_MAX:20}
